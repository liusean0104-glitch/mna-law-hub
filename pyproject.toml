[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mna-law-hub"
version = "0.1.0"
description = "Taiwan M&A / corporate-governance legal reference hub — API + static frontend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lawhub.data" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
