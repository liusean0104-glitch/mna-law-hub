# One-click deploy config for Render (https://render.com)
# The free tier sleeps after inactivity; first request then takes ~30s.
services:
  - type: web
    name: mna-law-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this in the Render dashboard, never in git
      - key: LAWHUB_LLM
        value: gemini
      - key: LAWHUB_MODEL
        value: gemini-3.5-flash-lite
      - key: LAWHUB_PUBLIC
        value: "1"
      - key: LAWHUB_RATE_PER_MIN
        value: "5"
      - key: LAWHUB_RATE_PER_DAY
        value: "40"
      - key: LAWHUB_GLOBAL_PER_DAY
        value: "500"
