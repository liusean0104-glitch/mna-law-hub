# Publishes the static (查詢-only) site to GitHub Pages.
# The AI features need a server, so they are hidden in this build —
# see docs/DEPLOY.md for the full deployment with /api.
name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate frontend data from the Python corpus
        run: python scripts/export_web.py
      - name: Mark this build as static (hides AI panels)
        run: echo "window.__STATIC_BUILD__ = true;" > web/build-flags.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
